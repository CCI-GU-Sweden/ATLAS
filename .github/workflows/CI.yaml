# .github/workflows/CI.yaml
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build
        run: python -m build
      - name: Check dist contents
        run: ls -lah dist

  test:
    name: Import smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: atlas-napari
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install package with test extras
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge napari "pyqt6>=6.7" pip
          python -m pip install --upgrade pip
          python -m pip install ".[testing]"
      - name: Run smoke tests
        shell: bash -el {0}
        run: python -m pytest
