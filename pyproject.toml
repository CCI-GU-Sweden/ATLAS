[project]
name = "atlas-cci-align"
description = "Code to open, stitch and z-align roughly and finely SEM images from an ATLAS project"
authors = [
    {name = "Rafael Camacho", email = "rafael.camacho@gu.se"},
    {name = "Simon Leclerc", email = "simon.leclerc@gu.se"},
]
readme = "README.md"
license = {file = "LICENSE"}
dynamic = ["version"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=2.1.0",
    "zarr>=2.0.0",
    "pandas>=2.1.0",
    "xmltodict>=1.0.0",
    "matplotlib>=3.0.0",
    "shapely",
    "pylibCZIrw>=6.1.0",
    "czitools",
    "scipy",
    "scikit-image==0.25.2",
    "tifffile",
    "python-dateutil"
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]
fix = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that need external data or long-running processing",
]
